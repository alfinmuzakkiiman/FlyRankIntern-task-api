services:
  app:
    build: .
    container_name: task-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: taskdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: